server:
  port: 8081

spring:
  application:
    name: orderservice

  datasource:
    url: jdbc:postgresql://localhost:5433/orderdb
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true