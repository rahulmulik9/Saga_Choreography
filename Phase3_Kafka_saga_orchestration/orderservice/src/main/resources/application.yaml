server:
  port: 8081

spring:
  application:
    name: orderservice

  datasource:
    url: jdbc:postgresql://localhost:5433/orderdb
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.type.mapping: >-
          orderPending:com.rahul.orderservice.event.producerEvent.OrderPendingEvent,
          paymentRequested:com.rahul.orderservice.event.producerEvent.PaymentRequestedEvent,
          releaseInventory:com.rahul.orderservice.event.producerEvent.ReleaseInventoryEvent
    consumer:
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.rahul.orderservice.event"
        spring.json.type.mapping: >-
          inventoryReserved:com.rahul.orderservice.event.consumerEvent.InventoryReservedEvent,
          inventoryRejected:com.rahul.orderservice.event.consumerEvent.InventoryRejectedEvent,
          paymentSuccessful:com.rahul.orderservice.event.consumerEvent.PaymentSuccessfulEvent,
          paymentFailed:com.rahul.orderservice.event.consumerEvent.PaymentFailedEvent